[package]
name = "lichterkette-tester"
version = "0.1.0"
edition = "2024"
description = "Mac test tool for Bluetooth light sets (same protocol as the Home Assistant integration)"

[dependencies]
btleplug = "0.13.5"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = "1.29.2"

[profile.release]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false }
libc = "0.2"
